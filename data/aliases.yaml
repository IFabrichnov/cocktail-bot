# Словарь алиасов: каноническое название из каталога -> синонимы.
#
# Зачем: пользователь вводит «джин», «сок лайма» или «Fresh Lime Juice»,
# а каталог хранит «Gin» и «Lime Juice». Словарь переводит всё к одному виду.
#
# Правила:
#   * ключ - название из TheCocktailDB в нижнем регистре, как в каталоге;
#   * синонимы - любые написания на любом языке; регистр не важен;
#   * один синоним не должен встречаться у двух ключей: побеждает первый;
#   * «lime» и «lime juice» - РАЗНЫЕ ингредиенты: фрукт и сок.
#
# Этот файл версионируется вместе с кодом. Расширяй его по отчёту:
#   cocktail report            # что не распознано
#   cocktail find --have "..."  # что не нашлось

version: 1

ingredients:
  # --- крепкий алкоголь ------------------------------------------------------
  gin: [джин, джина, джином, джинн]
  vodka: [водка, водки, водку, вотка]
  rum: [ром, рома, ромом]
  light rum: [белый ром, светлый ром, white rum]
  dark rum: [тёмный ром, темный ром]
  tequila: [текила, текилы, текилу]
  whiskey: [виски]
  bourbon: [бурбон, бурбона]
  scotch: [скотч, шотландский виски]
  brandy: [бренди]
  cognac: [коньяк, коньяка]
  vermouth: [вермут, вермута]
  dry vermouth: [сухой вермут, dry vermouth]
  sweet vermouth: [сладкий вермут, красный вермут]
  triple sec: [трипл сек, триплсек]
  aperol: [апероль, апероля]
  campari: [кампари]
  champagne: [шампанское, шампанского]
  prosecco: [просекко]
  wine: [вино, вина]
  absinthe: [абсент, абсента]
  liqueur: [ликёр, ликер, ликёра]

  # --- соки ------------------------------------------------------------------
  lime juice: [сок лайма, сок из лайма, лаймовый сок, fresh lime juice]
  lemon juice: [сок лимона, сок из лимона, лимонный сок, fresh lemon juice]
  orange juice: [апельсиновый сок, сок апельсина, oj]
  pineapple juice: [ананасовый сок, сок ананаса]
  cranberry juice: [клюквенный сок, сок клюквы]
  grapefruit juice: [грейпфрутовый сок, сок грейпфрута]
  tomato juice: [томатный сок, сок томата]
  apple juice: [яблочный сок, сок яблока]
  peach juice: [персиковый сок]

  # --- фрукты и ягоды --------------------------------------------------------
  lime: [лайм, лайма, лаймом]
  lemon: [лимон, лимона, лимоном]
  orange: [апельсин, апельсина]
  lemon peel: [лимонная цедра, цедра лимона, лимонная корка, lemon twist]
  orange peel: [апельсиновая цедра, цедра апельсина, orange twist]
  strawberry: [клубника, земляника]
  raspberry: [малина]
  blackberry: [ежевика]
  blueberry: [черника]
  pineapple: [ананас, ананаса]
  cherry: [вишня, черешня]
  peach: [персик]
  apple: [яблоко, яблоки]

  # --- травы, специи, прочее -------------------------------------------------
  mint: [мята, мяты, свежая мята, fresh mint]
  basil: [базилик]
  ginger: [имбирь, имбиря]
  cinnamon: [корица, корицы]
  nutmeg: [мускатный орех]
  salt: [соль, соли]
  sugar: [сахар, сахара]
  sugar syrup: [сироп, сахарный сироп, простой сироп, simple syrup]
  honey: [мёд, мед, мёда]
  ice: [лёд, лед, льда, кубики льда]
  water: [вода, воды]
  cream: [сливки, сливок]
  milk: [молоко, молока]
  coconut milk: [кокосовое молоко, кокосовые сливки]
  egg: [яйцо, яйца]
  egg white: [яичный белок, белок яйца]
  coffee: [кофе]
  espresso: [эспрессо]
  chocolate: [шоколад, шоколада]
  cocoa: [какао]

  # --- газировки и миксеры ---------------------------------------------------
  soda water: [содовая, газированная вода, soda, club soda]
  tonic water: [тоник, тоника, тоник-уотер]
  cola: [кола, кока-кола, кока кола]
  ginger ale: [имбирный эль, джинджер эль]
  ginger beer: [имбирное пиво, джинджер бир]
  sprite: [спрайт]
  lemonade: [лимонад]

  # --- биттеры и добавки -----------------------------------------------------
  angostura bitters: [ангостура, биттер ангостура, angostura]
  bitters: [биттер, биттеры]
  grenadine: [гренадин, гренадина]
  tabasco sauce: [табаско, соус табаско]
  worcestershire sauce: [вустерский соус, ворчестер]
