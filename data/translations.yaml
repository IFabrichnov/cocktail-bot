instructions:
  "Margarita": "Провести долькой лайма по краю бокала и посыпать солью, смачивая только внешний край. Остальные ингредиенты взболтать со льдом и осторожно перелить в бокал."
  "Mojito": "Размять листья мяты с сахаром и соком лайма. Добавить немного содовой, заполнить бокал колотым льдом, влить ром и долить содовой. Украсить и подать с соломинкой."
  "Negroni": "Перемешать в бокале со льдом, украсить и подать."
  "Daiquiri": "Перелить всё в шейкер со льдом, хорошо взболтать и процедить в охлаждённый коктейльный бокал."
  "Whiskey Sour": "Взболтать со льдом, процедить в охлаждённый бокал, украсить и подать. Вариант «со льдом»: процедить в олд-фэшн, наполненный льдом."
  "Gin Tonic": "Наполнить хайбол льдом, влить джин, долить тоником, выжать дольку лимона и украсить ею же."
  "Manhattan": "Перемешать со льдом, процедить в охлаждённый бокал, украсить и подать без льда."
  "Old Fashioned": "Положить кубик сахара в олд-фэшн, пропитать биттером, добавить дэш воды и размешать до растворения. Заполнить льдом, влить виски, украсить апельсиновой спиралью и вишней."
  "Cosmopolitan": "Сложить всё в шейкер со льдом, хорошо взболтать и двойным процеживанием перелить в большой коктейльный бокал. Украсить кружком лайма."
  "Mai Tai": "Взболтать всё со льдом, процедить в бокал, украсить и подать с соломинкой."
  "Pina Colada": "Взбить с колотым льдом в блендере до однородности. Перелить в охлаждённый бокал, украсить и подать."
  "Tequila Sunrise": "Налить текилу и апельсиновый сок в бокал со льдом. Добавить гренадин, он осядет на дно. Аккуратно размешать, чтобы получился эффект рассвета. Украсить и подать."
  "Screwdriver": "Смешать в хайболе со льдом. Украсить и подать."
  "Moscow Mule": "Соединить водку и имбирное пиво в хайболе со льдом. Добавить сок лайма, аккуратно размешать, украсить."
  "Cuba Libre": "Собрать всё в коллинзе со льдом. Украсить долькой лайма."
  "Bellini": "Налить персиковое пюре в охлаждённый флюте, добавить игристое вино и аккуратно размешать."
  "Mimosa": "Охладить оба ингредиента и смешать в бокале. Подавать холодным."
  "Kir": "Налить крем де кассис на дно бокала и долить вином."
  "Kamikaze": "Взболтать всё со льдом, процедить в бокал, украсить и подать."
  "Lemon Drop": "Взболтать и процедить в охлаждённый коктейльный бокал с сахарным ободком."
  "B-52": "Уложить ингредиенты слоями в шот. Подать с трубочкой для размешивания."
  "Grasshopper": "Перелить всё в шейкер со льдом, энергично взболтать и процедить в охлаждённый коктейльный бокал."
  "Irish Coffee": "Подогреть кофе, виски и сахар, не доводя до кипения. Перелить в бокал, сверху уложить сливки и подать горячим."
  "White Russian": "Налить водку и кофейный ликёр на лёд в олд-фэшн. Долить сливками и подать."
  "Sidecar": "Сложить всё в шейкер со льдом, хорошо взболтать и процедить в коктейльный бокал."
  "Aviation": "Сложить всё в шейкер со льдом, хорошо взболтать и процедить в коктейльный бокал. Украсить вишней."
  "Gimlet": "Сложить всё в шейкер со льдом, взболтать и процедить в охлаждённый коктейльный бокал или олд-фэшн со свежим льдом. Украсить кружком лайма."
  "Tom Collins": "В шейкере, наполовину заполненном льдом, соединить джин, сок лимона и сахар. Хорошо взболтать, процедить в коллинз, почти полный льда, влить содовую, размешать, украсить вишней и долькой апельсина."
  "Sazerac": "Ополоснуть охлаждённый олд-фэшн абсентом, добавить колотый лёд и отставить. Остальные ингредиенты перемешать со льдом. Вылить лёд и остатки абсента из бокала, процедить напиток в него. Украсить лимонной цедрой."
  "Paloma": "Перемешать и подать со льдом."
  "Dark and Stormy": "В хайбол со льдом влить 6 cl тёмного рома и долить имбирным пивом. Украсить долькой лайма."
  "Sea breeze": "Собрать всё в хайболе со льдом. Украсить долькой лайма."
  "Greyhound": "Влить водку в коллинз со льдом, долить грейпфрутовым соком и размешать."
  "Salty Dog": "Налить всё на лёд в хайболе, хорошо размешать и подать. Вместо джина можно взять водку."
  "Long Island Iced Tea": "Смешать всё в хайболе и аккуратно размешать. Добавить дэш кока-колы для цвета и украсить твистом лимона или лайма."
  "Mint Julep": "В хайболе аккуратно размять мяту, сахар и воду. Заполнить колотым льдом, влить бурбон и размешивать, пока бокал не запотеет. Украсить веточкой мяты."
  "French 75": "Соединить джин, сахар и сок лимона в шейкере со льдом. Энергично взболтать и процедить в охлаждённый бокал для шампанского, долить шампанским и аккуратно размешать."
  "Espresso Martini": "Перелить всё в шейкер со льдом, энергично взболтать и процедить в охлаждённый бокал мартини."
