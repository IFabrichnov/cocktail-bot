[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cocktail-bot"
dynamic = ["version"]
description = "Подбор коктейлей по ингредиентам, которые уже есть. Детерминированное ядро, Telegram-бот - позже."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ifabr" }]
keywords = ["cocktails", "ingredients", "telegram-bot", "search"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Private :: Do Not Upload",
]
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]
bot = ["aiogram>=3.15"]

[project.scripts]
cocktail = "cocktail.cli:main"

[tool.hatch.version]
path = "src/cocktail/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cocktail"]

# --- линтер ------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["data", ".pytest-tmp", ".tmp", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF"]
# RUF001-003 - неоднозначные unicode-символы (тире, кавычки) в русских строках.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["cocktail"]

# --- типы --------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
warn_no_return = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# --- тесты -------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["cocktail"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
